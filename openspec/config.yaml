schema: spec-driven

context: |
  TalkScout: a CFP finder for upcoming dev conferences. A speaker types a topic
  in plain English and the app returns the top 5 upcoming dev conferences whose
  CFP topics semantically match, ranked by cosine similarity, with CFP status
  visible at a glance.

  Tech stack:
  - TypeScript 5.x strict, Node.js 22 LTS
  - Next.js 15 App Router with Server Actions
  - React 19, Tailwind CSS v4, shadcn/ui (Input, Card, Badge, Button)
  - Prisma 6.x against SQL Server 2025 (mcr.microsoft.com/mssql/server:2025-latest)
  - SQL Server 2025 features used: native VECTOR(768) data type, VECTOR_DISTANCE
  - Embeddings: nomic-embed-text via host-side Ollama (NOT via T-SQL AI functions)
  - npm (broader audience familiarity than pnpm/yarn)

  Architectural rules (NON-NEGOTIABLE):
  - All T-SQL lives ONLY in prisma/sql/. The two files are searchEvents.sql and
    upsertEvents.sql. They are loaded as string constants at module load by
    src/lib/sql.ts and invoked via prisma.$queryRawUnsafe / $executeRawUnsafe.
    Prisma TypedSQL is NOT used because it does not support the sqlserver
    provider.
  - Prisma 7.8 with the @prisma/adapter-mssql driver adapter. Node >= 22.13
    required (set in package.json engines). The schema's datasource block has
    NO `url = env(...)` (Prisma 7 removed that). Connection URL is declared in
    `prisma.config.ts` at repo root for Migrate, and constructed at runtime via
    `new PrismaMssql(process.env.DATABASE_URL!)` in `src/lib/db.ts` and
    `prisma/seed.ts`. The seed file MUST `import 'dotenv/config'` at the top so
    DATABASE_URL is loaded when run via tsx (Prisma's CLI used to auto-load it
    in v6, but the Node-side adapter requires explicit dotenv).
  - Embeddings are produced in Node via the ollama npm package, NOT via SQL
    Server's CREATE EXTERNAL MODEL or AI_GENERATE_EMBEDDINGS.
  - Container resource quotas: every SQL Server container is capped at 2 GB
    memory and 2 CPUs.
  - SQL Server 2025 image runs platform: linux/amd64 on Apple Silicon (Rosetta).
  - Ollama runs on the host (not in a container) so it gets Metal acceleration
    on Apple Silicon. This applies to local development AND to the dev container
    workflow: dev container users install Ollama on their host first (the README
    documents the four steps), and the dev container reaches it via
    `OLLAMA_HOST=http://host.docker.internal:11434`. The `runArgs` in
    `.devcontainer/devcontainer.json` adds `--add-host=host.docker.internal:host-gateway`
    so the lookup resolves on OrbStack and Linux hosts too. We do NOT install
    Ollama as a dev container feature: running it inside the Linux/amd64
    workspace container would lose Metal acceleration and is what the
    architectural choice exists to avoid.
  - The dev container uses Docker-outside-of-Docker
    (`ghcr.io/devcontainers/features/docker-outside-of-docker:1`): the host's
    Docker socket is mounted into the container, so `docker compose up` from
    inside the dev container starts SQL Server as a sibling container on the
    host's Docker daemon. We avoid Docker-in-Docker because containerd 2.3 +
    the dind feature currently fail to start on M-series Macs (the dind
    feature's bundled containerd hangs at boot). Sibling-container is also
    faster: no double emulation.
  - To make container-to-container networking universal across Docker Desktop,
    OrbStack, and Codespaces, the dev container and the SQL Server container
    share an explicit Docker network named `talkscout_default`. The dev
    container has `"runArgs": ["--network=talkscout_default"]` and an
    `initializeCommand` that creates the network if it does not already exist.
    `docker-compose.yml` declares the same network name as its default. Inside
    the dev container, the database is reached by its container name:
    `DATABASE_URL=sqlserver://talkscout-mssql:1433;...`. We do NOT use
    `host.docker.internal` for the database because OrbStack does not route
    container traffic through the host gateway to other containers' published
    ports (only Docker Desktop does). On the host (no dev container), the
    `.env` file uses `localhost:1433` because the container publishes the port.
    The project's root `docker-compose.yml` remains the one source of truth
    for SQL Server config; the dev container does NOT define its own.

  Cloud deployment rules (apply when generating Azure-related code or infra):
  - The cloud target must be reproducible on a free Azure account with no
    quota approvals required. Cost target: literal $0 for the demo workload.
  - Compute is Azure Container Apps (ACA) consumption tier. The same ACA
    environment hosts two revisions:
    - `talkscout-web`: built from the repo's `Dockerfile` (multi-stage,
      `node:22-bookworm-slim`, Next.js `output: 'standalone'`,
      `EXPOSE 3000`, runs `node server.js`). External ingress on 3000.
    - `talkscout-ollama`: image `ollama/ollama:latest`, internal-only
      ingress on 11434. A startup hook runs `ollama pull nomic-embed-text`
      before serving traffic; the revision has a readinessProbe so ACA
      does not route requests until the model is loaded.
  - Database is Azure SQL Database, **free offer** (serverless General
    Purpose, 32 GB, 100k vCore-seconds/month). `VECTOR(N)` and
    `VECTOR_DISTANCE` are supported on all tiers including free.
  - Embedding model is `nomic-embed-text` (768-dim) in both local and
    cloud. Cloud just changes `OLLAMA_HOST` from
    `http://host.docker.internal:11434` to `http://talkscout-ollama:11434`
    (ACA internal DNS). Schema dimension is identical across local and
    cloud; no SQL templating is required.
  - `src/lib/embed.ts` is a thin dispatcher selected by
    `EMBEDDING_PROVIDER` (default `ollama`). `embed-ollama.ts` is the only
    implementation required for the default cloud deploy.
    `embed-azure-openai.ts` exists as an opt-in alternative for users
    with Azure OpenAI quota; it returns 1536-dim vectors and is NOT part
    of the default deploy. Schema dim stays 768 unless a user explicitly
    provisions a new 1536-dim DB.
  - Service-to-service auth uses managed identity. The `talkscout-web`
    Container App's system-assigned identity has the SQL roles it needs
    (`db_datareader + db_datawriter`, plus `db_owner` for the first-run
    seed Job). `DATABASE_URL` on the deployed revision uses
    `Authentication=Active Directory Default` rather than a password.
    No API keys or passwords in environment variables on the deployed
    revision.
  - Azure Key Vault is used only if the seed Job needs a transient SQL
    admin password during the very first bootstrap (before managed
    identity grants are in place). The web app itself does not read
    Key Vault.
  - Cloud DB schema is bootstrapped by an Azure Container Apps **Job**
    that runs `npx prisma migrate deploy` followed by `npm run db:seed`.
    The same migrations work cloud and local because the schema dimension
    is constant. The Job is idempotent.
  - The `microsoft/azure-skills` plugin is installed by the agent at
    apply-time (task 0 of the deployment change's `tasks.md`). The repo
    does NOT vendor the plugin code; it is a runtime prerequisite
    declared in the spec.
  - The Dockerfile is multi-stage (deps → build → runtime) using
    `node:22-bookworm-slim`. `.dockerignore` excludes `.next`,
    `node_modules`, `.devcontainer`, `openspec/changes`, and
    `data/dev-events.html` (the large fixture is regenerated at build
    time from `data/events.json`).
  - Alternatives considered and rejected: Azure App Service F1 / Azure
    Static Web Apps do not cleanly host the Ollama sidecar in the same
    environment with internal-only DNS-by-service-name. Azure OpenAI as
    primary embeddings requires quota approval and breaks
    first-time-audience reproducibility.

  Project state:
  - Database: 91 events seeded from data/dev-events.html via prisma/seed.ts.
  - Search hot path: Browser to Server Action to embed(query) via Ollama, then
    prisma.$queryRawUnsafe(SEARCH_EVENTS_SQL, JSON.stringify(vector), 5), then
    SQL Server VECTOR_DISTANCE TOP 5 ranking.
  - Full architecture diagrams live at `openspec/specs/architecture.md`
    (Mermaid: search hot path + seed ingest path). Update that file when the
    architecture changes.
  - The repo at the pre-implement git tag has the foundation (Prisma schema,
    migrations applied, src/lib/{db,embed,sql}.ts, prisma/sql/*.sql, seed.ts,
    placeholder src/app/page.tsx) but NOT the search UI components, Server
    Action, or cfp-status utility. Those land on camera via /opsx-apply.

  Demo:
  - 8-minute Data Exposed YouTube recording, 2026-05-11 (Monday).
  - Repeatable across takes via TWO terminals:
    - Terminal A: `npm run demo:reset` (rewinds to pre-implement, recreates
      Docker volume, migrates, seeds). Does NOT start the dev server.
    - Terminal B: `npm run dev` (foreground; you control it, Ctrl+C stops it).
    After `/opsx-apply`, Ctrl+C Terminal B and run `npm run dev:restart`
    there so Tailwind v4 picks up the new class names from the freshly
    created component files.
  - The previous demo:reset that auto-started the dev server in background
    was removed because the script-managed dev server caused recording-day
    failures (silent kills, no recovery path, log noise).
  - Two scripted on-camera search queries: "agentic workflows for databases"
    and "type safety across the stack". Both demonstrate vocabulary mismatch.

  Style:
  - No em-dashes anywhere in generated documentation, comments, scripts.
  - No "I've" contractions; write "I have".
  - Short, direct sentences. Conventional Commits.

  UI styling rules (apply when generating components or page composition):
  - When a change introduces React components, the tasks.md MUST include
    an explicit task to REPLACE `src/app/page.tsx`. The pre-implement
    `page.tsx` is a one-paragraph placeholder Home component. Without
    replacing it, none of the new components render even though they
    exist on disk. The task title should be "feat(page): replace
    placeholder with composed search UI" (or equivalent Conventional
    Commits prefix). List `src/app/page.tsx` under MODIFIED files in the
    proposal, NOT under NEW files. /opsx-apply MUST surface a diff for
    `src/app/page.tsx`; if the diff is empty or absent, the apply is
    incomplete.
  - Server Action file rules (NON-NEGOTIABLE): when a file has
    `'use server'` at the top, EVERY export must be an `async function`.
    Next.js rejects any other export at compile time with: "A 'use
    server' file can only export async functions, found object."
    Specifically:
    - `export type Foo = ...` and `export interface Foo` are OK
      (types are erased at compile time).
    - `export const FOO = ...`, `export default {...}`, exported Zod
      schemas, exported non-async functions are all FORBIDDEN.
    - If the Server Action needs to share a type with a client
      component (e.g., `SearchResult` shared between `actions.ts` and
      `search-input.tsx`), put the type in `src/lib/types.ts` (or a
      similar non-`'use server'` file) and import it from both sides.
      DO NOT define it inside `actions.ts`.
    The /opsx-propose tasks.md MUST name `src/lib/types.ts` as a
    separate task whenever the Server Action's signature involves a
    custom return type. /opsx-apply MUST NOT inline non-function
    exports into any `'use server'` file.
  - Force dark mode. In src/app/layout.tsx the html tag MUST have
    `className="font-sans dark"` and `style={{ colorScheme: "dark" }}`.
    The body MUST be `bg-zinc-950 text-zinc-100 antialiased` with NO `dark:`
    variant classes (we are not respecting system preference; the demo is
    always dark).
  - Add a subtle radial indigo glow at the top of the page as ambient depth.
    Implementation: in body, before children, render
    `<div className="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,rgba(79,70,229,0.12),transparent_50%)]" />`.
  - Page bg is zinc-950, cards float slightly lighter on top. Cards rendered
    via shadcn `Card` are fine as-is in dark mode (the .dark CSS variables
    handle it). Do not override the Card component.
  - Title gradient: indigo-to-purple via tailwind classes
    `bg-gradient-to-r from-accent to-accent-deep bg-clip-text text-transparent`
    (the @theme variables for accent/accent-deep are set in globals.css to
    #4f46e5 and #7c3aed).

  SearchInput component rules (NON-NEGOTIABLE for visual quality):
  - DO NOT use shadcn's `<Input>` component for the search input. Its
    `bg-input/30` semi-transparent background bleeds the gradient wrapper
    through and makes the placeholder unreadable. Use a plain `<input>`
    element instead.
  - The wrapper is a `<div>` with classes
    `w-full rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 p-[2px] shadow-lg shadow-indigo-500/20 transition-shadow focus-within:shadow-indigo-500/40`.
  - The inner `<input>` has classes
    `h-12 w-full rounded-[10px] bg-zinc-900 px-4 text-base text-zinc-100 placeholder:text-zinc-400 outline-none disabled:cursor-not-allowed disabled:opacity-60`.
  - Placeholder cycling: every 3 seconds, while the input is empty AND
    unfocused, cycle through the 5 example queries documented in
    data/queries.md (the 2 primary + 3 backup queries from the seed). Stop
    cycling on first keystroke and never resume in the same session.

  EventCard / Button-as-anchor rule (NON-NEGOTIABLE):
  - When wrapping shadcn `Button` with a `render={<a ...>}` prop to make it a
    link, ALWAYS pass `nativeButton={false}` as well. Without it, Base UI's
    `ButtonPrimitive` throws a console error about losing native button
    semantics. Example:
        <Button
          variant="outline"
          size="sm"
          nativeButton={false}
          render={<a href={url} target="_blank" rel="noopener noreferrer" />}
        >
          Submit Proposal
        </Button>

  Tailwind class generation rule:
  - Tailwind v4's class scanner sometimes misses many-file-at-once drops on
    Apple Silicon. After a large `/opsx-apply` run, restart the dev server
    with `pkill -f "next dev" && rm -rf .next && npm run dev` if the page
    renders unstyled. This is a known operator step, not a code defect.

rules:
  proposal:
    - Keep proposals under 600 words.
    - Lead with the user-facing change, not the implementation.
    - Always include a "Non-goals" section so out-of-scope items are explicit.
  design:
    - Honor the architecture rules in context above; do not propose alternatives
      that violate them (e.g. raw T-SQL in TypeScript, AI_GENERATE_EMBEDDINGS,
      EXTERNAL MODEL).
  tasks:
    - Each task names exactly one deliverable file (or a small tight group).
    - Use a Conventional Commits prefix as the task title's verb.
    - Tasks must be independently testable; typecheck and build are the gates.
  deployment:
    - The first task of any Azure-deployment change MUST be installing the
      microsoft/azure-skills plugin in the agent's CLI. For GitHub Copilot
      (the agent used by this project), the install is TWO commands in this
      order: `/plugin marketplace add microsoft/azure-skills` (one-time per
      machine, registers the GitHub-hosted marketplace) followed by
      `/plugin install azure@azure-skills`. Mark these as tasks 0.1 and 0.2
      in tasks.md. The marketplace name is `microsoft/azure-skills` (a
      GitHub repo path), NOT `claude-plugins-official` (which is a Claude
      Code marketplace and does not exist in GitHub Copilot). The repo
      does not vendor the plugin; the agent installs it itself at apply-
      time. Source: https://github.com/microsoft/azure-skills#github-copilot-cli
    - One resource group per environment. Bicep must be idempotent; re-running
      `azd up` against an existing RG produces no drift.
    - No literal passwords or API keys on the deployed web revision. Use
      managed identity for app->Azure SQL DB. Key Vault is only acceptable for
      transient bootstrap secrets used by the seed Job.
    - The Bicep must declare both ACA revisions (talkscout-web external,
      talkscout-ollama internal) in the same environment so they share
      internal DNS. talkscout-ollama runs `ollama pull nomic-embed-text` at
      startup and has a readinessProbe gating ingress until the pull
      completes.
    - Cost target is $0 on the Azure free offer + ACA consumption grant.
      Validate after deploy with `az consumption usage list`.
